<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(500px 300px at 50% 0%, rgba(255, 170, 60, 0.08), transparent 60%),
                #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe {
            width: 280px;
            height: 380px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            overflow: hidden;
            background: #000000;
        }
    </style>
</head>
<body>
    <iframe src="popup.html" scrolling="no"></iframe>
</body>
</html>
